# Builds the browser port in web/ and publishes it to GitHub Pages.
#
# The site is served at https://<owner>.github.io/<repository>/, so Vite is told to prefix asset URLs with
# /<repository>/. Pages must be set to deploy from GitHub Actions (Settings > Pages > Source) for the deploy job to
# run. The build packs the game's data from POOLRAD/ into the site.
name: Web port

on:
  push:
    branches: [main]
    paths: ['web/**', 'src/**', 'POOLRAD/**', '.github/workflows/web.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # the game's Pascal to TypeScript, then the page
      - run: npm run gen
      - run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
